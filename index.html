<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pacientes com Saldo Devedor – ClinicCorp</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f4f6fa;
  color: #1f2937;
  padding: 24px;
  min-height: 100vh;
}
.container { max-width: 1280px; margin: 0 auto; }
header {
  background: linear-gradient(135deg, #1e3a8a, #0e7490);
  color: white;
  padding: 24px 32px;
  border-radius: 14px 14px 0 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
header h1 { font-size: 24px; font-weight: 700; }
header p { opacity: 0.85; margin-top: 4px; font-size: 14px; }

.panel {
  background: white;
  padding: 18px 24px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box { flex: 1; min-width: 280px; position: relative; }
.search-box input {
  width: 100%;
  padding: 10px 14px 10px 40px;
  border: 1.5px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}
.search-box input:focus { outline: none; border-color: #1e3a8a; }
.search-box::before {
  content: "🔍"; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); opacity: 0.5;
}
select, .btn {
  padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px;
  background: white; font-size: 14px; cursor: pointer;
}
.btn-clear { background: #f3f4f6; }
.btn-toggle {
  background: #1e3a8a; color: white; border-color: #1e3a8a;
}
.btn-toggle:hover { background: #1e40af; }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  background: white;
  padding: 18px 24px;
  border-bottom: 1px solid #e5e7eb;
}
.stat-card {
  background: #f9fafb;
  border-left: 4px solid #1e3a8a;
  padding: 12px 16px;
  border-radius: 6px;
}
.stat-card.devedor { border-left-color: #dc2626; }
.stat-card.parcelas { border-left-color: #f59e0b; }
.stat-card.pacientes { border-left-color: #0e7490; }
.stat-label { font-size: 12px; text-transform: uppercase; color: #6b7280; letter-spacing: 0.5px; }
.stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-sub { font-size: 12px; color: #6b7280; margin-top: 2px; }

.list-wrap {
  background: white;
  border-radius: 0 0 14px 14px;
  padding: 16px 24px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.patient {
  border: 1.5px solid #e5e7eb;
  border-radius: 10px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color .15s;
}
.patient:hover { border-color: #cbd5e1; }
.patient.open { border-color: #1e3a8a; }

.patient-header {
  display: grid;
  grid-template-columns: 40px 1fr auto auto auto;
  gap: 14px;
  align-items: center;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  background: #fff;
}
.patient.open .patient-header { background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
.chevron {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  color: #6b7280;
  transition: transform .2s;
  font-size: 18px;
}
.patient.open .chevron { transform: rotate(90deg); color: #1e3a8a; }
.patient-rank {
  background: #1e3a8a; color: white;
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.patient-info { min-width: 0; }
.patient-name { font-size: 16px; font-weight: 600; color: #111827; }
.patient-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
.patient-meta span { margin-right: 12px; }
.patient-stat {
  text-align: right;
  min-width: 90px;
}
.patient-stat-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; }
.patient-stat-value { font-size: 14px; font-weight: 600; margin-top: 2px; }
.patient-saldo { color: #dc2626; font-size: 16px; }

.parcelas-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.parcelas-table th {
  background: #f1f5f9;
  padding: 9px 14px;
  text-align: left;
  font-weight: 600;
  color: #475569;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  border-bottom: 1px solid #e2e8f0;
}
.parcelas-table td {
  padding: 10px 14px;
  border-bottom: 1px solid #f1f5f9;
  color: #374151;
}
.parcelas-table tr:last-child td { border-bottom: none; }
.parcelas-table tr:hover { background: #fafbfc; }
.parcel-vencido { color: #dc2626; font-weight: 600; }
.parcel-amount { font-weight: 600; color: #111827; text-align: right; }
.parcel-num { font-family: ui-monospace, "SF Mono", monospace; font-size: 12px; color: #6b7280; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tag-aviso {
  background: #fef3c7; color: #92400e;
}

.parcelas-body { display: none; }
.patient.open .parcelas-body { display: block; }

.empty {
  padding: 60px 20px;
  text-align: center;
  color: #6b7280;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

footer {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  margin-top: 16px;
}

@media (max-width: 720px) {
  .patient-header { grid-template-columns: 30px 1fr auto; gap: 10px; padding: 12px 14px; }
  .patient-rank { display: none; }
  .patient-stat:not(:last-child) { display: none; }
  body { padding: 12px; }
  header { padding: 18px 20px; }
  .panel, .stats, .list-wrap { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Pacientes com Saldo Devedor</h1>
    <p>Clique em um paciente para ver as parcelas pendentes. Gerado a partir de PaymentItem.xlsx (status pendente, headers não deletados).</p>
  </header>

  <div class="panel">
    <div class="search-box">
      <input id="search" type="text" placeholder="Buscar por nome, CPF ou prontuário..." autocomplete="off">
    </div>
    <select id="sort">
      <option value="saldo-desc">Maior saldo</option>
      <option value="saldo-asc">Menor saldo</option>
      <option value="nome-asc">Nome (A-Z)</option>
      <option value="nome-desc">Nome (Z-A)</option>
      <option value="parcelas-desc">Mais parcelas</option>
    </select>
    <button class="btn btn-toggle" id="toggle-all" onclick="toggleAll()">Expandir tudo</button>
    <button class="btn btn-clear" onclick="clearFilters()">Limpar</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="list-wrap" id="list"></div>

  <footer>
    Total de 98 pacientes • Gerado em 14/05/2026
  </footer>
</div>

const state = { search: "", sort: "saldo-desc", openAll: false, openSet: new Set() };

const fmtBRL = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtDate = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};
const today = new Date().toISOString().slice(0, 10);

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );
}

function filterAndSort() {
  const term = state.search.trim().toLowerCase();
  let rows = DATA.filter((p) => {
    if (!term) return true;
    const hay = `${p.nome} ${p.doc} ${p.prontuario ?? ""} ${p.phone}`.toLowerCase();
    return hay.includes(term);
  });
  const sorters = {
    "saldo-desc": (a, b) => b.saldo - a.saldo,
    "saldo-asc": (a, b) => a.saldo - b.saldo,
    "nome-asc": (a, b) => a.nome.localeCompare(b.nome, "pt-BR"),
    "nome-desc": (a, b) => b.nome.localeCompare(a.nome, "pt-BR"),
    "parcelas-desc": (a, b) => b.qtd_parcelas - a.qtd_parcelas,
  };
  rows.sort(sorters[state.sort]);
  return rows;
}

function renderStats(rows) {
  const totalSaldo = rows.reduce((s, r) => s + r.saldo, 0);
  const totalParcelas = rows.reduce((s, r) => s + r.qtd_parcelas, 0);
  const vencidas = rows.reduce((s, r) => s + r.parcelas.filter((p) => p.vencimento && p.vencimento < today).length, 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat-card pacientes">
      <div class="stat-label">Pacientes</div>
      <div class="stat-value">${rows.length.toLocaleString("pt-BR")}</div>
      <div class="stat-sub">com saldo devedor</div>
    </div>
    <div class="stat-card devedor">
      <div class="stat-label">Saldo devedor total</div>
      <div class="stat-value">${fmtBRL(totalSaldo)}</div>
      <div class="stat-sub">soma de todas as parcelas pendentes</div>
    </div>
    <div class="stat-card parcelas">
      <div class="stat-label">Parcelas pendentes</div>
      <div class="stat-value">${totalParcelas.toLocaleString("pt-BR")}</div>
      <div class="stat-sub">${vencidas} já vencida(s)</div>
    </div>
  `;
}

function renderList(rows) {
  const wrap = document.getElementById("list");
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">📋</div>Nenhum paciente encontrado.</div>`;
    return;
  }
  wrap.innerHTML = rows.map((p, i) => {
    const open = state.openAll || state.openSet.has(p.id);
    const parcelas = p.parcelas.map((pc) => {
      const vencido = pc.vencimento && pc.vencimento < today;
      return `
        <tr>
          <td class="parcel-num">${pc.parcela_num}/${pc.total_parcelas}</td>
          <td>${escapeHtml(pc.descricao)}</td>
          <td>${escapeHtml(pc.forma)}</td>
          <td class="${vencido ? "parcel-vencido" : ""}">
            ${fmtDate(pc.vencimento)}
            ${vencido ? `<span class="tag" style="margin-left:6px;">vencida</span>` : ""}
          </td>
          <td class="parcel-amount">${fmtBRL(pc.valor)}</td>
        </tr>
      `;
    }).join("");
    const prontuario = p.prontuario != null ? `<span>Prontuário ${p.prontuario}</span>` : "";
    const doc = p.doc ? `<span>CPF ${escapeHtml(p.doc)}</span>` : "";
    const phone = p.phone ? `<span>📱 ${escapeHtml(p.phone)}</span>` : "";
    return `
      <div class="patient${open ? " open" : ""}" data-id="${p.id}">
        <div class="patient-header" onclick="togglePatient('${p.id}')">
          <div class="chevron">▶</div>
          <div class="patient-info">
            <div class="patient-name">${i + 1}. ${escapeHtml(p.nome)}</div>
            <div class="patient-meta">${prontuario}${doc}${phone}</div>
          </div>
          <div class="patient-stat">
            <div class="patient-stat-label">Parcelas</div>
            <div class="patient-stat-value">${p.qtd_parcelas}</div>
          </div>
          <div class="patient-stat">
            <div class="patient-stat-label">Já pago</div>
            <div class="patient-stat-value">${fmtBRL(p.total_pago)}</div>
          </div>
          <div class="patient-stat">
            <div class="patient-stat-label">Saldo devedor</div>
            <div class="patient-stat-value patient-saldo">${fmtBRL(p.saldo)}</div>
          </div>
        </div>
        <div class="parcelas-body">
          <table class="parcelas-table">
            <thead>
              <tr>
                <th>Parcela</th>
                <th>Descrição</th>
                <th>Forma</th>
                <th>Vencimento</th>
                <th style="text-align:right;">Valor</th>
              </tr>
            </thead>
            <tbody>${parcelas}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join("");
}

function togglePatient(id) {
  if (state.openAll) {
    state.openAll = false;
    state.openSet = new Set(DATA.map((p) => p.id));
    document.getElementById("toggle-all").textContent = "Expandir tudo";
  }
  if (state.openSet.has(id)) state.openSet.delete(id);
  else state.openSet.add(id);
  render();
}

function toggleAll() {
  state.openAll = !state.openAll;
  state.openSet.clear();
  document.getElementById("toggle-all").textContent = state.openAll ? "Recolher tudo" : "Expandir tudo";
  render();
}

function clearFilters() {
  state.search = "";
  document.getElementById("search").value = "";
  render();
}

function render() {
  const rows = filterAndSort();
  renderStats(rows);
  renderList(rows);
}

document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  render();
});
document.getElementById("sort").addEventListener("change", (e) => {
  state.sort = e.target.value;
  render();
});

render();
</script>
</body>
</html>
